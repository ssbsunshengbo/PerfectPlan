name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, matching the app version (for example v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  verify-release:
    name: Verify release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - id: version
        name: Read application version
        run: |
          VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Require a matching release tag
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$RELEASE_TAG" = "v$APP_VERSION"

  build-macos:
    name: Build macOS installer
    needs: verify-release
    runs-on: macos-latest
    env:
      PERFECTPLAN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      PERFECTPLAN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      PERFECTPLAN_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import Apple distribution certificate
        if: ${{ env.PERFECTPLAN_APPLE_CERTIFICATE != '' && env.PERFECTPLAN_APPLE_CERTIFICATE_PASSWORD != '' && env.PERFECTPLAN_KEYCHAIN_PASSWORD != '' }}
        env:
          APPLE_CERTIFICATE: ${{ env.PERFECTPLAN_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.PERFECTPLAN_APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ env.PERFECTPLAN_KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - name: Build signed macOS draft release
        if: ${{ env.PERFECTPLAN_APPLE_CERTIFICATE != '' && env.PERFECTPLAN_APPLE_CERTIFICATE_PASSWORD != '' && env.PERFECTPLAN_KEYCHAIN_PASSWORD != '' }}
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ env.PERFECTPLAN_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.PERFECTPLAN_APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ env.PERFECTPLAN_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: PerfectPlan ${{ inputs.tag }}
          releaseBody: See CHANGELOG.md for the release notes.
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: ${{ inputs.prerelease }}
          args: --bundles dmg
      - name: Build unsigned macOS draft release
        if: ${{ env.PERFECTPLAN_APPLE_CERTIFICATE == '' || env.PERFECTPLAN_APPLE_CERTIFICATE_PASSWORD == '' || env.PERFECTPLAN_KEYCHAIN_PASSWORD == '' }}
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: PerfectPlan ${{ inputs.tag }}
          releaseBody: See CHANGELOG.md for the release notes.
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: ${{ inputs.prerelease }}
          args: --bundles dmg

  build-windows:
    name: Build Windows installer
    needs: build-macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: PerfectPlan ${{ inputs.tag }}
          releaseDraft: true
          prerelease: ${{ inputs.prerelease }}
          args: --bundles nsis
