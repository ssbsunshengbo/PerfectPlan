name: Feature request
description: Suggest an improvement to PerfectPlan.
labels: [feature, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the planning problem before suggesting a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Explain how the feature should feel from a user's perspective.
    validations:
      required: true
